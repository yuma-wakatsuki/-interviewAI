name: Build Windows distribution

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Build Chrome extension
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Install local recognition build dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r server\requirements.txt
          .\.venv\Scripts\python.exe -m server.download_model

      - name: Build and smoke-test the self-contained package
        shell: pwsh
        run: .\scripts\build_windows.ps1

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: InterviewAI-Windows
          path: InterviewAI-Windows.zip
          if-no-files-found: error
          retention-days: 30
